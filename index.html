<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokédex</title>
    <link href="./styles.css" rel="stylesheet" />
</head>
<body>
    <header class="bg-danger text-white py-3 mb-4">
        <div class="container">
            <h1>Pokédex</h1>
        </div>
    </header>
    <main>
        <div class="container">
            <form id="form1" class="row g-2 mb-3">
                <div class="col-12 col-md-4">
                    <input type="number" name="pokedex-number" class="form-control" placeholder="Número de la Pokédex" min="1" required>
                </div>
                <div class="col-12 col-md-2">
                    <button type="submit" class="btn btn-primary w-100">Buscar</button>
                </div>
                <div class="col-12 col-md-6">
                    <input type="text" id="pokemon-name" class="form-control" placeholder="Nombre" readonly>
                </div>
            </form>

            <div class="progress mb-3 d-none" id="Load-bar">
                <div class="progress-bar progress-bar-striped w-100">Cargando...</div>
            </div>

            <div class="row g-3 mb-4" id="pokemon-list"></div>
        </div>

        <div class="modal fade" id="pokemon-modal" tabindex="-1" aria-labelledby="pokemon-modal-title" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h2 class="modal-title fs-5" id="pokemon-modal-title"></h2>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                    </div>
                    <div class="modal-body" id="pokemon-modal-body"></div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <footer>
        <script type="module" src="./scripts.js"></script>
    </footer>
</body>
</html>
